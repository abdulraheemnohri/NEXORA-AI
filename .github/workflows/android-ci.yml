name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Pin to the stable GA image; ubuntu-latest currently rolls to the Ubuntu 26.04 preview.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Uses the checked-in wrapper; setup-gradle v4 also validates the wrapper JAR.
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - name: Run Android lint
        run: ./gradlew :app:lintDebug
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest
      # GitHub-hosted Ubuntu runners expose KVM but the device is not always
      # readable by the runner user. Grant access before starting the AVD.
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ ! -c /dev/kvm ]; then
            echo "::error::This runner did not expose /dev/kvm. Android instrumentation requires a KVM-capable Linux runner."
            ls -la /dev/kvm 2>&1 || true
            exit 1
          fi
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::The runner cannot read and write /dev/kvm after applying the udev rule."
            ls -l /dev/kvm
            exit 1
          fi
          ls -l /dev/kvm
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          script: ./gradlew :app:connectedDebugAndroidTest
