name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Pin to the stable GA image; ubuntu-latest currently rolls to the Ubuntu 26.04 preview.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Uses the checked-in wrapper; setup-gradle v4 also validates the wrapper JAR.
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - name: Run Android lint
        run: ./gradlew :app:lintDebug
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest
      # Best-effort KVM setup. The emulator runner's auto mode falls back
      # to software acceleration when the runner user cannot access /dev/kvm.
      - name: Configure and diagnose KVM (best effort)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -c /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm || true
            id
            ls -l /dev/kvm
            if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
              echo "::notice::KVM access is available; emulator runner auto mode can use hardware acceleration."
            else
              echo "::warning::KVM exists but is not accessible to this process; emulator runner auto mode will use software acceleration."
            fi
          else
            echo "::warning::/dev/kvm is not exposed; emulator runner auto mode will use software acceleration."
          fi
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disable-linux-hw-accel: auto
          emulator-boot-timeout: 900
          script: ./gradlew :app:connectedDebugAndroidTest
